image: node:24

stages: [check]

check:
  stage: check
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile
  script:
    - pnpm lint
    - pnpm test
    - pnpm build
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
  variables:
    npm_config_store_dir: .pnpm-store
