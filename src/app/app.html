<app-toolbar
    (openImage)="openFilePicker()"
    (showShortcuts)="showShortcuts()"
    (toggleClasses)="classesOpen.set(!classesOpen())"
/>

<div class="relative flex min-h-0 flex-1">
    <main id="stage" class="flex min-h-0 min-w-0 flex-1" aria-label="Editor">
        <app-canvas-stage />
    </main>

    <aside
        aria-label="Classes and settings"
        class="w-72 shrink-0 border-l border-line max-md:absolute max-md:inset-y-0 max-md:right-0 max-md:z-20 max-md:shadow-2xl"
        [class.max-md:hidden]="!classesOpen()"
    >
        <app-classes-panel class="h-full" />
    </aside>
</div>

<app-status-bar />

@if (editor.error(); as message) {
    <div
        class="fixed bottom-10 left-1/2 z-40 w-[min(28rem,calc(100vw-2rem))] -translate-x-1/2"
    >
        <az-alert tone="danger" title="Could not open the image">
            <span class="flex items-start justify-between gap-3">
                {{ message }}
                <button
                    type="button"
                    class="btn-icon -my-1 size-7 shrink-0"
                    aria-label="Dismiss"
                    (click)="editor.dismissError()"
                >
                    <app-icon name="close" [size]="16" />
                </button>
            </span>
        </az-alert>
    </div>
}

<input
    #fileInput
    type="file"
    class="hidden"
    tabindex="-1"
    aria-hidden="true"
    [accept]="accept"
    (change)="onFileChosen($event)"
/>

<app-shortcuts-dialog />
